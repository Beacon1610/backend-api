spring.application.name=backend-api
server.port=8081
  # 1. Thông tin kết nối Database MySQL (chạy trong Docker Container)
spring.datasource.url=jdbc:mysql://mysql-db:3306/backend_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root123

# 2. Cấu hình JPA / Hibernate
# Vẫn giữ nguyên tính năng tự động tạo bảng dựa trên các class @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect